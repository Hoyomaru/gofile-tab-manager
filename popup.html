<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gofile Tab Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <h1>Gofile Tab Manager</h1>

    <div class="primary-action">
      <button id="sort-button" class="primary wide" type="button">Gofileタブを並び替え</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <section aria-labelledby="window-state-heading">
      <h2 id="window-state-heading">現在ウィンドウの状態</h2>
      <div class="stats" aria-live="polite">
        <div><span>正常</span><strong id="normal-count">0</strong></div>
        <div><span>その他Gofile</span><strong id="other-count">0</strong></div>
        <div><span>アクセス制限</span><strong id="rate-limited-count">0</strong></div>
        <div><span>読み込み中</span><strong id="loading-count">0</strong></div>
        <div><span>要確認</span><strong id="attention-count">0</strong></div>
        <div><span>保護</span><strong id="protected-count">0</strong></div>
      </div>
    </section>

    <div class="actions">
      <button id="reclassify-button" class="secondary" type="button">再判定</button>
      <button id="pause-button" class="secondary" type="button" aria-pressed="false">自動クローズ一時停止</button>
    </div>

    <section aria-labelledby="history-heading">
      <h2 id="history-heading">最近自動で閉じたタブ</h2>
      <div id="history" class="history"></div>
    </section>
  </main>

  <script src="shared/constants.js"></script>
  <script src="shared/url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
