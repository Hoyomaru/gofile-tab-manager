<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gofile Tab Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <h1>Gofile Tab Manager</h1>

    <section aria-labelledby="window-state-heading">
      <h2 id="window-state-heading">現在ウィンドウの状態</h2>
      <div class="stats" aria-live="polite">
        <div><span>NORMAL</span><strong id="normal-count">0</strong></div>
        <div><span>その他Gofile</span><strong id="other-count">0</strong></div>
        <div><span>ATTENTION</span><strong id="attention-count">0</strong></div>
        <div><span>PROTECTED</span><strong id="protected-count">0</strong></div>
      </div>
    </section>

    <button id="sort-button" class="primary" type="button">並び替え</button>
    <p id="status" class="status" role="status"></p>

    <section aria-labelledby="history-heading">
      <h2 id="history-heading">Recent auto-closed</h2>
      <div id="history" class="history"></div>
    </section>
  </main>

  <script src="shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
